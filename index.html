<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shadow Player · 이 부분, 들어 봐</title>
<meta name="description" content="친구가 보낸 노래의 그 부분">
<meta property="og:title" content="이 부분, 들어 봐">
<meta property="og:description" content="Shadow Player로 보낸 노래의 그 부분">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=Noto+Sans+KR:wght@400;700;900&display=swap">
<style>
  /* One screen: the brush phrase, the song card with its part, then the ways to listen. */
  :root {
    color-scheme: dark;
    --ink: #12060a;
    --crimson: #e11d48;
    --deep: #7f1d3a;
    --rose: #fda4af;
    --paper: #fff1f2;
    --muted: #f1c5cd;
    --line: #ffffff26;
    --font-ui: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
    --font-brush: "Nanum Brush Script", "Noto Sans KR", cursive;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    background: radial-gradient(120% 80% at 20% 0%, #e11d48 0%, #9f1239 45%, #3b0a18 100%) fixed, var(--ink);
    color: var(--paper);
    font-family: var(--font-ui);
    display: flex; justify-content: center;
  }
  main { width: 100%; max-width: 440px; padding: 40px 20px calc(32px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 26px; }
  .phrase { font-family: var(--font-brush); font-size: 3.4rem; line-height: 1.05; text-align: center; margin: 18px 0 4px; text-wrap: balance; }
  .card { display: flex; gap: 16px; align-items: center; background: #00000038; border: 1px solid var(--line); border-radius: 22px; padding: 14px; }
  .cover { width: 92px; height: 92px; border-radius: 14px; flex: none; background: linear-gradient(135deg, #5b2333, #1d0b11); display: grid; place-items: center; font-size: 2.4rem; color: var(--rose); overflow: hidden; }
  .cover img { width: 100%; height: 100%; object-fit: cover; }
  .meta { min-width: 0; display: flex; flex-direction: column; gap: 6px; }
  .title { font-weight: 900; font-size: 1.15rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .artist { color: var(--muted); font-size: .92rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .span { align-self: flex-start; background: var(--paper); color: var(--deep); font-weight: 900; font-size: .86rem; padding: 4px 12px; border-radius: 99px; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-direction: column; gap: 10px; }
  a.btn { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 54px; border-radius: 16px; font-weight: 700; font-size: 1rem; text-decoration: none; color: var(--paper); background: #ffffff1f; border: 1px solid var(--line); }
  a.btn.main { background: var(--paper); color: #7a0f2a; border-color: transparent; font-size: 1.05rem; }
  a.btn:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
  .hint { color: var(--muted); font-size: .8rem; line-height: 1.6; text-align: center; margin: 0; }
  .brand { display: flex; flex-direction: column; align-items: center; gap: 10px; letter-spacing: .5em; font-weight: 700; font-size: .78rem; color: #ffffffb0; margin-top: 8px; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; box-shadow: 0 6px 22px #00000066; }
  a.btn img { width: 26px; height: 26px; border-radius: 7px; }
  /* Just the part, played here (YouTube songs): a button first, the player once it's tapped. */
  .preview { display: flex; flex-direction: column; gap: 10px; }
  button.listen { display: flex; align-items: center; justify-content: center; gap: 10px; min-height: 58px; width: 100%; border: 0; border-radius: 16px; font: inherit; font-weight: 900; font-size: 1.05rem; color: var(--paper); background: linear-gradient(90deg, #9f1239, #be3455 55%, #f2a0a6); cursor: pointer; }
  button.listen:focus-visible { outline: 3px solid var(--rose); outline-offset: 2px; }
  .frame { position: relative; width: 100%; aspect-ratio: 16 / 9; border-radius: 16px; overflow: hidden; background: #000; border: 1px solid var(--line); }
  .frame > * { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
  .note { color: var(--muted); font-size: .86rem; text-align: center; margin: 0; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <p class="phrase" id="phrase">이 부분, 들어 봐</p>

  <section class="card" aria-label="노래">
    <div class="cover" id="cover">♪</div>
    <div class="meta">
      <div class="title" id="title">노래</div>
      <div class="artist" id="artist"></div>
      <div class="span" id="span" hidden></div>
    </div>
  </section>

  <section class="preview" id="preview" hidden aria-label="이 부분 미리 듣기">
    <button class="listen" id="listen" type="button">▶ 이 부분 듣기</button>
    <div class="frame" id="frame" hidden><div id="player"></div></div>
    <p class="note" id="note" hidden></p>
  </section>

  <nav class="actions">
    <a class="btn main" id="app" href="#">앱에서 듣기</a>
    <a class="btn" id="web" href="#">브라우저에서 듣기</a>
    <a class="btn" id="shadow" href="#" hidden><img class="appicon" alt="">Shadow Player로 열기</a>
  </nav>
  <p class="hint" id="hint">앱이 열리지 않으면 오른쪽 위 ⋮ 에서 ‘외부 브라우저로 열기’를 눌러 주세요.</p>

  <div class="brand"><img class="appicon" alt="Shadow Player 아이콘">SHADOW PLAYER</div>
</main>

    const frame = document.getElementById('frame');
    const note = document.getElementById('note');
    listen.textContent = '▶ 이 부분 듣기 · ' + clock(start) + ' – ' + clock(end);
    preview.hidden = false;
    // Played here, start to end: a plain YouTube link would only start there and run on to the end.
    document.getElementById('web').hidden = true;
    let player = null;
    // Again: loaded afresh with its end, which a plain seek back would forget.
    const fromStart = () => player.loadVideoById({ videoId, startSeconds: start, endSeconds: end });
    window.onYouTubeIframeAPIReady = () => {
      player = new YT.Player('player', {
        videoId,
        playerVars: { start, end, autoplay: 1, playsinline: 1, rel: 0, modestbranding: 1 },
        events: {
          onStateChange: e => {
            if (e.data === YT.PlayerState.ENDED) {
              listen.textContent = '↻ 다시 듣기 · ' + clock(start) + ' – ' + clock(end);
              listen.hidden = false;
            }
          },
          onError: () => {
            frame.hidden = true;
            listen.hidden = true;
            note.textContent = '이 곡은 여기서 들을 수 없어요. 아래 버튼으로 앱에서 들어 주세요.';
            note.hidden = false;
          },
        },
      });
    };
    listen.addEventListener('click', () => {
      listen.hidden = true;
      frame.hidden = false;
      if (player) { fromStart(); return; }
      const api = document.createElement('script');
      api.src = 'https://www.youtube.com/iframe_api';
      document.head.appendChild(api);
    });
  }
</script>
</body>
</html>
